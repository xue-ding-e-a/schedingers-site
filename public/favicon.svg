<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="薛定谔的站点">
  <style>
    .ink {
      fill: #1d1a2b;
    }
    .orbit {
      stroke: #1d1a2b;
    }
    @media (prefers-color-scheme: dark) {
      .ink {
        fill: #f6f4f0;
      }
      .orbit {
        stroke: #f6f4f0;
      }
    }
  </style>
  <g transform="rotate(30 16 16)">
    <ellipse class="orbit" cx="16" cy="16" rx="13.5" ry="5.25" fill="none" stroke-opacity="0.5" stroke-width="1.35" stroke-linecap="round"/>
    <circle cx="2.5" cy="16" r="1.7" fill="#e4ab63"/>
  </g>
  <g transform="rotate(-30 16 16)">
    <ellipse class="orbit" cx="16" cy="16" rx="13.5" ry="5.25" fill="none" stroke-opacity="0.5" stroke-width="1.35" stroke-linecap="round"/>
    <circle cx="29.5" cy="16" r="1.7" fill="#7c67e4"/>
  </g>
  <circle class="ink" cx="16" cy="16" r="4"/>
</svg>
