<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">薛定谔的站点</title>
  <desc id="logoDesc">一个粒子与两条轨道组成的标识</desc>
  <defs>
    <linearGradient id="core" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b4eff"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <linearGradient id="orbit" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b4eff"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5c8a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ff5c8a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
  <g fill="none" stroke="url(#orbit)" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="196" ry="92" transform="rotate(-28 256 256)" stroke-width="13" opacity="0.62"/>
    <ellipse cx="256" cy="256" rx="196" ry="92" transform="rotate(28 256 256)" stroke-width="13" opacity="0.38"/>
  </g>
  <circle cx="404" cy="142" r="12" fill="#7c67e4"/>
  <circle cx="79" cy="197" r="10" fill="#e4ab63"/>
  <circle cx="256" cy="256" r="54" fill="url(#core)"/>
  <circle cx="256" cy="256" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
</svg>
